services:
  - type: web
    name: obsidian-secure
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: obsidian-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "1"
      - key: PERSISTENT_DISK_PATH
        value: /var/lib/obsidian/data
      - key: PUBLIC_BASE_URL
        value: https://obsidian-secure-ootw.onrender.com
    disk:
      name: obsidian-data
      mountPath: /var/lib/obsidian/data
      sizeGB: 10

databases:
  - name: obsidian-db
    plan: free
