services:
  - type: web
    name: obsidian-secure
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 --worker-class gthread app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: obsidian-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "1"
      - key: PERSISTENT_DISK_PATH
        value: /var/lib/obsidian/data
      - key: PUBLIC_BASE_URL
        sync: false
    disk:
      name: obsidian-data
      mountPath: /var/lib/obsidian/data
      sizeGB: 10

databases:
  - name: obsidian-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
